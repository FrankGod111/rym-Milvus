<!DOCTYPE html>

<title>月明智能管理平台</title>
<script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.13/dayjs.min.js"></script>
<script>
// 确保 dayjs 加载，否则使用降级方案
(function() {
  if (typeof dayjs === 'undefined') {
    window.dayjs = function(date) {
      var d = date ? new Date(date) : new Date();
      var pad = function(n, w) { w = w || 2; return String(n).padStart(w, '0'); };
      return {
        format: function(fmt) {
          return fmt.replace('YYYY', d.getFullYear()).replace('MM', pad(d.getMonth()+1)).replace('DD', pad(d.getDate())).replace('HH', pad(d.getHours())).replace('mm', pad(d.getMinutes())).replace('ss', pad(d.getSeconds()));
        },
        isAfter: function(o) { return d > new Date(o); },
        isBefore: function(o) { return d < new Date(o); },
        subtract: function(n, u) {
          var r = new Date(d);
          if (u === 'day') r.setDate(r.getDate() - n);
          var pad2 = function(n, w) { w = w || 2; return String(n).padStart(w, '0'); };
          return {
            format: function(fmt) {
              return fmt.replace('YYYY', r.getFullYear()).replace('MM', pad2(r.getMonth()+1)).replace('DD', pad2(r.getDate())).replace('HH', pad2(r.getHours())).replace('mm', pad2(r.getMinutes()));
            }
          };
        },
        locale: function(){},
        $loc: null
      };
    };
    window.dayjs.locale = function(){};
    window.dayjs.extend = function(){};
  } else {
    // dayjs 已加载，设置中文
    try { dayjs.locale('zh-cn'); } catch(e) {}
  }
})();
</script>
<link rel="stylesheet" href="/new/styles.css">
